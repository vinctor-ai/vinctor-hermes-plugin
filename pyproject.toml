[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinctor-hermes-plugin"
version = "0.6.0"
description = "Boundary Preview Hermes plugin for Vinctor runtime authorization."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Vinctor contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vinctor-ai/vinctor-hermes-plugin#readme"
Repository = "https://github.com/vinctor-ai/vinctor-hermes-plugin"
Issues = "https://github.com/vinctor-ai/vinctor-hermes-plugin/issues"

[project.scripts]
vinctor-hermes-plugin = "vinctor_hermes_plugin.cli:main"

[project.entry-points."hermes_agent.plugins"]
vinctor = "vinctor_hermes_plugin.plugin:register"

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vinctor_hermes_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
